name: Validate Desafio em Movimento for Render

on:
  push:
    branches:
      - main
    paths:
      - "render.yaml"
      - "artifacts/api-server/**"
      - "artifacts/desafio-em-movimento/**"
      - "lib/db/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck API
        run: pnpm --filter @workspace/api-server typecheck
      - name: Typecheck frontend
        run: pnpm --filter @workspace/desafio-em-movimento typecheck
      - name: Build API
        run: pnpm --filter @workspace/api-server build
      - name: Build frontend
        run: pnpm --filter @workspace/desafio-em-movimento build
        env:
          NODE_ENV: production
          PORT: 10000
          BASE_PATH: /
